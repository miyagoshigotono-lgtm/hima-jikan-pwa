<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>暇時間即答PWA</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2b6cb0">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="settingsButton" class="settings-button" aria-label="設定" style="display:none;">⚙️</button>
  <h1>暇時間即答</h1>

  <div id="setupPanel" class="setup-panel" style="display:none;">
    <p class="setup-desc">初回設定です。GASのWebアプリURLと共有シークレットを入力してください（この端末にのみ保存されます）。</p>
    <label>GAS_ENDPOINT
      <input id="setupEndpoint" type="url" placeholder="https://script.google.com/macros/s/.../exec">
    </label>
    <label>SHARED_SECRET
      <input id="setupSecret" type="text" placeholder="共有シークレット">
    </label>
    <button id="setupSave">保存</button>
    <div id="setupError" class="setup-error"></div>
  </div>

  <button id="micButton" class="mic-button" aria-label="音声入力">🎤</button>
  <div id="status" class="status">タップして話しかけてください</div>

  <div id="textFallback" class="text-fallback" style="display:none;">
    <input id="textInput" type="text" placeholder="例: 来月どこが空いてる？">
    <button id="textSubmit">送信</button>
  </div>

  <div id="resultCard" class="result-card"></div>
  <button id="retryButton" class="retry-button">もう一度試す</button>

  <script src="app.js"></script>
</body>
</html>
