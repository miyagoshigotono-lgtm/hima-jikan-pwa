<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>暇時間即答PWA</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2b6cb0">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="settingsButton" class="settings-button" aria-label="設定" style="display:none;">⚙️</button>
  <h1>暇時間即答</h1>

  <div id="calendarSection" class="calendar-section" style="display:none;">
    <div class="calendar-header">
      <button id="calPrev" class="cal-nav" aria-label="前の月">‹</button>
      <div id="calMonthLabel" class="cal-month-label"></div>
      <button id="calNext" class="cal-nav" aria-label="次の月">›</button>
    </div>
    <div class="calendar-weekdays">
      <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
    </div>
    <div id="calendarGrid" class="calendar-grid"></div>
    <div class="calendar-legend">
      <span><i class="legend-swatch night"></i>0-7時</span>
      <span><i class="legend-swatch day"></i>7-18時</span>
      <span><i class="legend-swatch eve"></i>18-24時</span>
      <span><i class="legend-swatch event"></i>予定</span>
      <span><i class="legend-swatch dayoff"></i>休み</span>
      <span><i class="legend-swatch today"></i>今日</span>
    </div>
    <div id="dayDetail" class="day-detail" style="display:none;"></div>
  </div>

  <div id="setupPanel" class="setup-panel" style="display:none;">
    <p class="setup-desc">初回設定です。GASのWebアプリURLと共有シークレットを入力してください（この端末にのみ保存されます）。</p>
    <label>GAS_ENDPOINT
      <input id="setupEndpoint" type="url" placeholder="https://script.google.com/macros/s/.../exec">
    </label>
    <label>SHARED_SECRET
      <input id="setupSecret" type="text" placeholder="共有シークレット">
    </label>
    <button id="setupSave">保存</button>
    <div id="setupError" class="setup-error"></div>
  </div>

  <button id="micButton" class="mic-button" aria-label="音声入力">🎤</button>
  <div id="status" class="status">タップして話しかけてください</div>

  <div id="textFallback" class="text-fallback" style="display:none;">
    <input id="textInput" type="text" placeholder="例: 来月どこが空いてる？">
    <button id="textSubmit">送信</button>
  </div>

  <div id="resultCard" class="result-card"></div>
  <button id="retryButton" class="retry-button">もう一度試す</button>

  <script src="app.js"></script>
</body>
</html>
